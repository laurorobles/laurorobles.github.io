<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#grad)" />
  <rect width="600" height="600" fill="url(#grid)" />
  
  <!-- Subtle accent circle -->
  <circle cx="300" cy="270" r="140" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.2" />
  <circle cx="300" cy="270" r="100" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
  <circle cx="300" cy="270" r="4" fill="#06b6d4" opacity="0.8" />

  <!-- Metadata header -->
  <text x="40" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#06b6d4" font-weight="bold" letter-spacing="2">// ARCHIVO DISCOGRÁFICO</text>
  <text x="560" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255,255,255,0.4)" text-anchor="end">2021</text>

  <!-- Title & Artist centered -->
  <text x="300" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">PROTECTIVE CORE</text>
  <text x="300" y="475" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="1">LAO & COPOUT</text>
  
  <!-- Minimalist bottom stamp -->
  <line x1="40" y1="520" x2="560" y2="520" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="40" y="550" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.3)">LAURO ROBLES / LAO</text>
  <text x="560" y="550" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="end">CDMX</text>
</svg>